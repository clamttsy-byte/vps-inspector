name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Test
        run: bash tests/run.sh
      - name: Lint
        run: shellcheck vps-inspector.sh tests/run.sh
